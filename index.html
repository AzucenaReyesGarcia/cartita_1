
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para ti ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

    /* CONFIGURACIÓN GENERAL */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #f8e9e3;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      width: 100%;
      overflow-x: hidden;
    }


    /* ==========================
       1. PORTADA PRINCIPAL
    ========================== */

    .portada {
      position: relative;
      min-height: 78vh;
      min-height: 78svh;
      width: 100%;

      background-image:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.15),
          rgba(0,0,0,0.55)
        ),
        url("imagenes/foto_1.png");

      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;

      display: flex;
      justify-content: center;
      align-items: flex-end;

      text-align: center;
      padding: 50px 20px;
    }

    .contenido {
      position: relative;
      z-index: 2;
      padding-bottom: 5px;
      width: 100%;
    }

    .para {
      font-size: 12px;
      letter-spacing: 5px;
      margin-bottom: 12px;
    }

    .nombre {
      font-family: 'Playfair Display', serif;
      font-size: clamp(38px, 9vw, 58px);
      font-weight: 400;
      margin-bottom: 12px;
    }

    .pareja {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(17px, 4vw, 19px);
      margin-bottom: 25px;
    }

    .fecha {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.8;
    }


    /* ==========================
       2. NUESTRA CANCIÓN
    ========================== */

    .cancion {
      min-height: 300px;
      background: #f8e9e3;
      color: #a18a7e;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 45px 20px;
      text-align: center;
    }

    .titulo-cancion {
      font-size: 12px;
      letter-spacing: 5px;
      margin-bottom: 35px;
    }

    .reproductor {
      width: 190px;
      height: 190px;
      max-width: 65vw;
      max-height: 65vw;

      border-radius: 50%;

      background-image: url("imagenes/foto_2.png");
      background-position: center;
      background-size: cover;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .reproductor::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.15);
    }

    .boton-play {
      position: relative;
      z-index: 2;

      width: 75px;
      height: 75px;

      border: none;
      border-radius: 50%;

      background: #e71945;
      color: white;
      font-size: 27px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: transform 0.3s;
    }

    .boton-play:hover {
      transform: scale(1.1);
    }


    /* ==========================
       3. GALERÍA HORIZONTAL
    ========================== */

    .galeria {
      background: #f8e9e3;
      color: #49332f;
      padding: 55px 0 65px;
      text-align: center;
      overflow: hidden;
    }

    .subtitulo-galeria {
      font-size: 10px;
      letter-spacing: 5px;
      color: #a18a7e;
      margin-bottom: 15px;
    }

    .titulo-galeria {
      font-family: 'Playfair Display', serif;
      font-size: clamp(25px, 6vw, 36px);
      font-weight: 400;
      margin-bottom: 35px;
      color: #49332f;
      padding: 0 15px;
    }

    /* CONTENEDOR DE FOTOS */

    .contenedor-fotos {
      display: flex;
      gap: 18px;

      overflow-x: auto;
      overflow-y: hidden;

      padding: 5px 20px 20px;

      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;

      scrollbar-width: none;
    }

    .contenedor-fotos::-webkit-scrollbar {
      display: none;
    }

    /* CADA FOTOGRAFÍA */

    .foto-galeria {
      flex: 0 0 280px;
      height: 350px;

      border-radius: 25px;
      overflow: hidden;

      background: #ead5cb;

      scroll-snap-align: center;
    }

    .foto-galeria img {
      width: 100%;
      height: 100%;

      object-fit: cover;
      display: block;

      transition: transform 0.4s ease;
    }

    .foto-galeria:hover img {
      transform: scale(1.04);
    }


    /* ==========================
       4. CELULARES
    ========================== */

    @media screen and (max-width: 600px) {

      .portada {
        min-height: 75vh;
        min-height: 75svh;
        padding: 35px 15px;
        background-position: center center;
      }

      .contenido {
        padding-bottom: 10px;
      }

      .para {
        font-size: 10px;
        letter-spacing: 4px;
        margin-bottom: 10px;
      }

      .nombre {
        font-size: clamp(36px, 11vw, 48px);
        margin-bottom: 8px;
      }

      .pareja {
        font-size: 17px;
        margin-bottom: 20px;
      }

      .fecha {
        font-size: 9px;
        letter-spacing: 1.3px;
        padding: 0 5px;
      }

      .cancion {
        min-height: 270px;
        padding: 35px 15px;
      }

      .titulo-cancion {
        font-size: 10px;
        letter-spacing: 4px;
        margin-bottom: 28px;
      }

      .reproductor {
        width: 165px;
        height: 165px;
      }

      .boton-play {
        width: 65px;
        height: 65px;
        font-size: 24px;
      }

      /* GALERÍA EN CELULAR */

      .galeria {
        padding: 45px 0 55px;
      }

      .titulo-galeria {
        font-size: 27px;
        margin-bottom: 28px;
      }

      .contenedor-fotos {
        gap: 15px;
        padding: 5px 20px 20px;
      }

      .foto-galeria {
        flex: 0 0 78vw;
        height: 390px;
        max-height: 65vh;
        border-radius: 23px;
      }

    }


    /* ==========================
       5. CELULARES PEQUEÑOS
    ========================== */

    @media screen and (max-width: 360px) {

      .portada {
        padding: 25px 12px;
      }

      .nombre {
        font-size: 35px;
      }

      .fecha {
        font-size: 8px;
        letter-spacing: 1px;
      }

      .reproductor {
        width: 145px;
        height: 145px;
      }

      .foto-galeria {
        flex-basis: 82vw;
        height: 340px;
      }

    }


    /* ==========================
       6. LAPTOP Y COMPUTADORAS
    ========================== */

    @media screen and (min-width: 768px) {

      .portada {
        min-height: 85vh;
        min-height: 85svh;
        padding: 55px 30px;
      }

      .cancion {
        min-height: 350px;
      }

      .reproductor {
        width: 210px;
        height: 210px;
      }

      .foto-galeria {
        flex: 0 0 300px;
        height: 380px;
      }

    }

  </style>
</head>


<body>


  <!-- ==========================
       PORTADA PRINCIPAL
  ========================== -->

  <section class="portada">

    <div class="contenido">

      <p class="para">PARA</p>

      <h1 class="nombre">Luisfer</h1>

      <p class="pareja">F & A</p>

      <p class="fecha">
        DE TU NOVIA · 29 DE NOVIEMBRE DE 2026
      </p>

    </div>

  </section>



  <!-- ==========================
       NUESTRA CANCIÓN
  ========================== -->

  <section class="cancion">

    <p class="titulo-cancion">
      NUESTRA CANCIÓN
    </p>

    <div class="reproductor">

      <button class="boton-play" id="playBtn">
        ▶
      </button>

    </div>

    <audio id="musica" src="nuestra-cancion.mp3"></audio>

  </section>



  <!-- ==========================
       GALERÍA DE RECUERDOS
  ========================== -->

  <section class="galeria">

    <p class="subtitulo-galeria">
      GALERÍA
    </p>

    <h2 class="titulo-galeria">
      Momentos que no se borran
    </h2>

    <div class="contenedor-fotos">

      <div class="foto-galeria">
        <img src="imagenes/galeria_1.jpg" alt="Nuestro recuerdo 1">
      </div>

      <div class="foto-galeria">
        <img src="imagenes/galeria_2.jpg" alt="Nuestro recuerdo 2">
      </div>

      <div class="foto-galeria">
        <img src="imagenes/galeria_3.jpg" alt="Nuestro recuerdo 3">
      </div>

      <div class="foto-galeria">
        <img src="imagenes/galeria_4.jpg" alt="Nuestro recuerdo 4">
      </div>

      <div class="foto-galeria">
        <img src="imagenes/galeria_5.jpg" alt="Nuestro recuerdo 5">
      </div>

    </div>

  </section>



  <!-- ==========================
       REPRODUCTOR DE MÚSICA
  ========================== -->

  <script>

    const musica = document.getElementById("musica");
    const boton = document.getElementById("playBtn");

    boton.addEventListener("click", () => {

      if (musica.paused) {

        musica.play()
          .then(() => {
            boton.textContent = "Ⅱ";
          })
          .catch(() => {
            alert("Agrega tu archivo de música para reproducirlo ❤️");
          });

      } else {

        musica.pause();
        boton.textContent = "▶";

      }

    });

    musica.addEventListener("ended", () => {
      boton.textContent = "▶";
    });

  </script>


</body>
</html>
